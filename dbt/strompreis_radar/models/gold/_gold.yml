version: 2

models:
  - name: fct_market_hour
    columns:
      - name: ts_utc
        data_tests:
          - unique
          - not_null
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: hour_of_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hour')
                field: hour_of_day
       
  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_hour
    columns:
      - name: hour_of_day
        data_tests:
          - unique
          - not_null
